name: Job Scam Investigator tests
on:
  push:
    paths:
      - 'plugins/security/**'
      - '.github/workflows/job-scam-investigator-tests.yml'
  pull_request:
    paths:
      - 'plugins/security/**'
      - '.github/workflows/job-scam-investigator-tests.yml'
jobs:
  unittest:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
        working-directory: plugins/security/skills/job-scam-investigator
